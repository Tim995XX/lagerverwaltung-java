spring.application.name=lagerverwaltung

# Datei-H2: Daten bleiben nach einem Neustart erhalten (Ordner ./data)
spring.datasource.url=jdbc:h2:file:./data/lager;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
# Schema aus den Entities erzeugen bzw. anpassen (für ein Lernprojekt ausreichend)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Beim ersten Start einige Artikel und Lagerplätze anlegen
lager.demodaten=true

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
