spring.application.name=lagerverwaltung

# PostgreSQL; die Vorgaben passen zu "docker compose up -d db".
# Das Passwort gilt nur für die lokale Entwicklung und lässt sich per Umgebungsvariable ersetzen.
spring.datasource.url=${LAGER_DB_URL:jdbc:postgresql://localhost:5432/lager}
spring.datasource.username=${LAGER_DB_BENUTZER:lager}
spring.datasource.password=${LAGER_DB_PASSWORT:lager}

# Das Schema verwaltet Flyway (db/migration). Hibernate prüft nur, ob Entities und Tabellen zusammenpassen.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Beim ersten Start einige Artikel und Lagerplätze anlegen
lager.demodaten=true
# Passwörter der Demobenutzer (nur beim allerersten Start verwendet, danach steht der Hash in der Datenbank)
lager.demo.passwort-leitstand=${LAGER_PASSWORT_LEITSTAND:leitstand}
lager.demo.passwort-fahrer=${LAGER_PASSWORT_FAHRER:fahrer}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health
