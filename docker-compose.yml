services:
  lager:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - lagerdaten:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  lagerdaten:
